[pytest]
# Fast, model-free by default.  Real-model smoke test:  pytest tests -m slow
addopts = -q -m "not slow" -p no:cacheprovider
testpaths = .
markers =
    slow: loads a real model (SigLIP) through photosearch.guard; opt-in with -m slow
filterwarnings =
    ignore::DeprecationWarning
    ignore::PIL.Image.DecompressionBombWarning
    ignore:Using `httpx` with `starlette.testclient`
